# nginx site for the stable MCP URL — /etc/nginx/sites-available/footage-mcp
# Replace footage-mcp.example.com with your subdomain, then:
#   ln -s /etc/nginx/sites-available/footage-mcp /etc/nginx/sites-enabled/
#   certbot --nginx -d footage-mcp.example.com   # TLS
#   nginx -t && systemctl reload nginx
#
# SECURITY NOTE: the MCP HTTP endpoint has no built-in auth. Anyone who
# guesses the URL can query it. Recommended: basic-auth below (or IP
# allowlisting) plus an unguessable subdomain.

server {
    server_name footage-mcp.example.com;

    # Optional HTTP basic auth (create file: htpasswd -c /etc/nginx/mcp.htpasswd mcp)
    # auth_basic "footage-mcp";
    # auth_basic_user_file /etc/nginx/mcp.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:18080;  # frps vhostHTTPPort
        proxy_set_header Host $host;        # frp routes by Host header — keep it
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    listen 443 ssl;
    # ssl_certificate / ssl_certificate_key added by certbot
}

server {
    server_name footage-mcp.example.com;
    listen 80;
    return 301 https://$host$request_uri;
}
