# frps (server side) — lives on your VPS, e.g. /etc/frp/frps.ini
# Replace REPLACE_ME_TOKEN with a long random secret (same value in frpc.ini).
# Only port 7000 must be reachable from the internet; the dashboard stays
# on localhost (view it via `ssh -L 17500:localhost:17500 vps`).

[common]
bindPort = 7000
token = REPLACE_ME_TOKEN

# HTTP vhost for tunneled services; nginx reverse-proxies to this port
# so public TLS terminates on your VPS, not on Colab.
vhostHTTPPort = 18080

# Optional dashboard (localhost only)
dashboardAddr = 127.0.0.1
dashboardPort = 17500
dashboardUser = admin
dashboardPwd = REPLACE_ME_TOKEN
